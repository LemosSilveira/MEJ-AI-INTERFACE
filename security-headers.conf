# PRD v3 §8.5 — cabeçalhos de segurança, num arquivo só.
#
# Existe separado por causa de uma regra do nginx que costuma passar batida:
# `add_header` NÃO é cumulativo entre níveis. Se um bloco `location` declara
# qualquer add_header próprio, ele DESCARTA todos os herdados do `server`.
# Como quase todos os locations aqui precisam do seu próprio Cache-Control,
# sem este include as respostas HTML sairiam sem X-Frame-Options, sem
# Referrer-Policy e sem CSP — exatamente as que mais precisam.
#
# Por isso este arquivo é incluído no server E em cada location que declara
# header próprio.
#
# `always` faz o header valer também nas respostas de erro, que é justamente
# quando costumam faltar.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP em modo REPORT-ONLY, como manda a §8.5: nesta forma não bloqueia nada,
# só reportaria violações. Serve para medir o impacto antes de ativar.
#
# Ao promover para `Content-Security-Policy`, confira antes que `connect-src`
# cobre o host real de VITE_API_URL — errar isso derruba o streaming, e o
# sintoma na tela é um "erro de conexão" genérico, difícil de rastrear.
#
# 'unsafe-inline' em style-src é necessário: o index.html tem o CSS do estado
# de carregamento inline, e a 404 é uma página autocontida.
add_header Content-Security-Policy-Report-Only "default-src 'self'; connect-src 'self' https://inova.atlab.ufc.br; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
